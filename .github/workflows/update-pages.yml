name: 活動獵人雲端更新

on:
  push:
    branches: [main]
  schedule:
    # UTC 16:00 = 每天台灣時間 00:00。
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activity-hunter-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    env:
      VITE_BASE_PATH: /sleeoafk.github.io/
    steps:
      - name: 取得專案
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 設定 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: 安裝固定版本的套件
        run: npm ci
      - name: 執行測試
        run: npm test
      - name: 記錄本次更新開始時間
        run: echo "REFRESH_STARTED_AT=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - name: 抓取兩個公告來源並建置網站
        run: npm run refresh
      - name: 驗證本次資料與發布檔案
        run: node scripts/verify-refresh.mjs
      - name: 上傳網站發布檔
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布活動獵人網站
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
